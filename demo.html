<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ListinoDiff — Demo</title><style>body{font:16px system-ui;max-width:1000px;margin:30px auto;padding:15px;color:#17243b}input,button{padding:10px;margin:8px}button{background:#1646aa;color:white;border:0;border-radius:6px;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}th{background:#eee}</style><h1>ListinoDiff — Demo gratuita</h1><p>Confronta due file CSV. Elaborazione locale, nessun invio dei file.</p><label>Listino precedente <input type="file" id="a" accept=".csv"></label><label>Listino aggiornato <input type="file" id="b" accept=".csv"></label><p><label>Soglia variazione prezzo % <input type="number" id="limit" value="15" min="0"></label></p><button id="example">Usa dati di esempio</button><button id="run">Confronta</button><p id="status"></p><section id="result" hidden><h2>Risultati</h2><p id="count"></p><button id="export">Esporta anomalie CSV</button><table><thead><tr><th>Tipo</th><th>SKU</th><th>Dettaglio</th><th>Prima</th><th>Dopo</th></tr></thead><tbody id="body"></tbody></table></section><p>Demo sperimentale: verifica sempre le segnalazioni prima di aggiornare dati reali. Supporta CSV, non XLSX.</p><script>
const $=x=>document.getElementById(x);let demo=false,issues=[];
const prev='SKU;Descrizione;Prezzo;Quantita\nA100;Vite;10;100\nB200;Bullone;25;60\nC300;Rondella;4,5;80\nD400;Dado;12;40\nF600;Cerniera;8;15';
const next='SKU;Descrizione;Prezzo;Quantita\nA100;Vite;12;90\nB200;Bullone;40;60\nC300;Rondella;4,5;0\nE500;Molla;6;20\nE500;Molla duplicata;6;20\nF600;Cerniera rinforzata;8;15';
$('example').onclick=()=>{demo=true;$('status').textContent='Esempio pronto: premi Confronta.'};$('a').onchange=$('b').onchange=()=>demo=false;
function csv(s){s=s.replace(/^\uFEFF/,'');const first=s.split(/\r?\n/)[0];const sep=first.includes(';')?';':first.includes('\t')?'\t':',';let rows=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===sep){row.push(v);v=''}else if(c==='\n'){row.push(v.replace(/\r$/,''));if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}if(q)throw Error('Virgolette non chiuse');row.push(v);if(row.some(x=>x.trim()))rows.push(row);if(rows.length<2)throw Error('CSV vuoto');const h=rows.shift().map(x=>x.trim().toLowerCase());if(rows.some(r=>r.length!==h.length))throw Error('Colonne non coerenti');return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i].trim()])))}
function val(r,keys){for(const k of keys)if(Object.hasOwn(r,k))return r[k];return undefined}const keys={sku:['sku','codice','codice_articolo'],price:['prezzo','price'],qty:['quantita','quantità','giacenza','stock','quantity'],name:['descrizione','nome','description']};function num(s){if(s===undefined||s==='')return null;let t=s.replace(/[€\s]/g,'');if(t.includes(',')&&t.includes('.'))t=t.lastIndexOf(',')>t.lastIndexOf('.')?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');else t=t.replace(',','.');const n=Number(t);return Number.isFinite(n)?n:null}
function add(...r){issues.push(r)}function idx(rows,source){let m=new Map();for(const r of rows){const k=val(r,keys.sku);if(k===undefined)throw Error('Manca colonna SKU');if(!k){add('SKU vuoto','',source,'','');continue}if(m.has(k))add('SKU duplicato',k,source,'','');else m.set(k,r)}return m}
$('run').onclick=async()=>{try{issues=[];if(!demo&&(!$('a').files[0]||!$('b').files[0]))throw Error('Seleziona due CSV o usa l’esempio');const a=demo?prev:await $('a').files[0].text(),b=demo?next:await $('b').files[0].text();const x=idx(csv(a),'precedente'),y=idx(csv(b),'aggiornato'),limit=Number($('limit').value);if(!Number.isFinite(limit)||limit<0)throw Error('Soglia non valida');for(const [sku,o] of x){if(!y.has(sku)){add('Prodotto scomparso',sku,'Presente solo nel listino precedente','','');continue}const n=y.get(sku),p=num(val(o,keys.price)),z=num(val(n,keys.price));if(p!==null&&z!==null&&p!==0&&Math.abs((z-p)/p*100)>=limit&&z!==p)add('Prezzo anomalo',sku,'Variazione '+((z-p)/Math.abs(p)*100).toFixed(1)+'%',p,z);const q=num(val(o,keys.qty)),w=num(val(n,keys.qty));if(q>0&&w===0)add('Scorta azzerata',sku,'Quantità passata a zero',q,w);const d=val(o,keys.name),e=val(n,keys.name);if(d!==undefined&&e!==undefined&&d!==e)add('Descrizione modificata',sku,'Controllare il testo',d,e)}for(const sku of y.keys())if(!x.has(sku))add('Nuovo prodotto',sku,'Presente solo nel listino aggiornato','','');$('body').replaceChildren();for(const row of issues){const tr=document.createElement('tr');for(const cell of row){const td=document.createElement('td');td.textContent=String(cell);tr.append(td)}$('body').append(tr)}$('count').textContent=x.size+' SKU precedenti · '+y.size+' SKU aggiornati · '+issues.length+' segnalazioni';$('result').hidden=false;$('status').textContent='Confronto completato'}catch(e){$('result').hidden=true;$('status').textContent='Errore: '+e.message}};
$('export').onclick=()=>{const esc=s=>{s=String(s);return /[;"\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};const data=[['Tipo','SKU','Dettaglio','Prima','Dopo'],...issues].map(r=>r.map(esc).join(';')).join('\r\n');const u=URL.createObjectURL(new Blob(['\uFEFF'+data],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='anomalie.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
