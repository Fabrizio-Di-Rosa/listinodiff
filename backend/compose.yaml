services:
  listinodiff-api:
    build: .
    container_name: listinodiff-api
    restart: unless-stopped
    environment:
      LISTINODIFF_DB: /data/feedback.sqlite3
      LISTINODIFF_ORIGIN: https://listinodiff.antefide.it
    volumes:
      - /opt/antefide/listinodiff/data:/data
    networks:
      - listinodiff-private
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 128m
networks:
  listinodiff-private:
    external: true
